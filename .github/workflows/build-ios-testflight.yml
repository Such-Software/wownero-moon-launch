name: Such Moon Launch iOS candidate / TestFlight

# Private-Mac release lane. A dispatch builds, signs, inspects, checksums, and
# retains an IPA by default. TestFlight delivery requires both an explicit
# upload choice and a new positive build number on the protected delivery branch.
on:
  workflow_dispatch:
    inputs:
      upload_to_testflight:
        description: "Upload the inspected IPA to TestFlight (protected master only)"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      build_number:
        description: "Positive iOS build number; required and above the committed baseline for upload"
        required: false
        default: ""
        type: string
      beta_group:
        description: "Optional exact internal TestFlight group name after Apple processing"
        required: false
        default: ""
        type: string

concurrency:
  group: such-moon-launch-ios-delivery
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  GODOT_VERSION: "4.6.1-stable"
  APP_NAME: "Such Moon Launch"
  BUNDLE_ID: "com.suchsoftware.suchmoonlaunch"
  TEAM_ID: "D8PL9F7X33"
  PROFILE_NAME: "SuchMoonLaunch_AppStore"
  MINIMUM_IOS: "14.0"

jobs:
  candidate:
    runs-on: macos-latest
    timeout-minutes: 75
    outputs:
      did_upload: ${{ steps.release_identity.outputs.did_upload }}
      build_number: ${{ steps.release_identity.outputs.build_number }}
      marketing_version: ${{ steps.release_identity.outputs.marketing_version }}
    steps:
      - uses: actions/checkout@v4
        env:
          # Temporary such-git self-signed-certificate exception, scoped to
          # this Node action rather than arbitrary downloads or Apple calls.
          NODE_TLS_REJECT_UNAUTHORIZED: "0"
        with:
          fetch-depth: 1
          lfs: false
          submodules: false
          persist-credentials: false

      - name: Validate request and committed release contract
        env:
          UPLOAD_TO_TESTFLIGHT: ${{ inputs.upload_to_testflight }}
          REQUESTED_BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          set -euo pipefail
          python3 tools/ci/check_release_contract.py

          case "$UPLOAD_TO_TESTFLIGHT" in
            true|false) ;;
            *) echo "FATAL: upload_to_testflight must be true or false"; exit 1 ;;
          esac

          if [ -n "$REQUESTED_BUILD_NUMBER" ] && ! [[ "$REQUESTED_BUILD_NUMBER" =~ ^[1-9][0-9]{0,17}$ ]]; then
            echo "FATAL: build_number must be a positive integer of at most 18 digits"
            exit 1
          fi

          if [ "$UPLOAD_TO_TESTFLIGHT" = "true" ]; then
            [ "${GITHUB_REF:-}" = "refs/heads/master" ] || {
              echo "FATAL: TestFlight delivery is allowed only from refs/heads/master."
              echo "Current ref: ${GITHUB_REF:-unset}"
              exit 1
            }
            [ -n "$REQUESTED_BUILD_NUMBER" ] || {
              echo "FATAL: TestFlight upload requires an explicit, reviewed, never-before-used build_number."
              exit 1
            }
            BASELINE="$(sed -n 's/^application\/version="\([^"]*\)"/\1/p' export_presets.cfg | head -1)"
            [ "$REQUESTED_BUILD_NUMBER" -gt "$BASELINE" ] || {
              echo "FATAL: upload build $REQUESTED_BUILD_NUMBER must exceed committed baseline $BASELINE."
              exit 1
            }
          fi

          echo "request accepted: ref=${GITHUB_REF:-unset} upload=$UPLOAD_TO_TESTFLIGHT build=${REQUESTED_BUILD_NUMBER:-committed}"

      - name: Verify and overlay declared iOS seed
        run: |
          set -euo pipefail
          SEED="$HOME/Library/Caches/such-ios-sdks/such-moon-launch-ios"
          python3 tools/ci/seed_manifest.py --root "$SEED"

          mkdir -p ios/framework ios/plugins
          rsync -a --delete "$SEED/ios/framework/" ios/framework/
          cp "$SEED/ios/plugins/AdmobPlugin.gdip" ios/plugins/AdmobPlugin.gdip
          for bundle in \
            AdmobPlugin.debug.xcframework \
            AdmobPlugin.release.xcframework \
            BloomwordFirebase.debug.xcframework \
            BloomwordFirebase.release.xcframework; do
            rm -rf "ios/plugins/$bundle"
            rsync -a "$SEED/ios/plugins/$bundle" "ios/plugins/$bundle"
          done
          cp "$SEED/ios/plugins/GoogleService-Info.plist" ios/plugins/GoogleService-Info.plist
          cp "$SEED/ios/GoogleService-Info.plist" ios/GoogleService-Info.plist

          # Re-hash the materialized checkout, not just the source cache.
          python3 tools/ci/seed_manifest.py --root .
          echo "IOS_SEED_ROOT=$SEED" >> "$GITHUB_ENV"

      - name: Locate Godot and install matching iOS templates
        run: |
          set -euo pipefail
          SYSTEM_GODOT="/Applications/Godot.app/Contents/MacOS/Godot"
          CACHE="$HOME/Library/Caches/such-godot/$GODOT_VERSION"
          CACHED_GODOT="$CACHE/Godot.app/Contents/MacOS/Godot"
          EXPECTED_VERSION="${GODOT_VERSION/-/.}"

          if [ -x "$SYSTEM_GODOT" ] && "$SYSTEM_GODOT" --version | grep -Fq "$EXPECTED_VERSION"; then
            GODOT_BIN="$SYSTEM_GODOT"
          else
            if [ ! -x "$CACHED_GODOT" ]; then
              mkdir -p "$CACHE"
              curl -fL -o "$RUNNER_TEMP/godot.zip" \
                "https://github.com/godotengine/godot/releases/download/$GODOT_VERSION/Godot_v${GODOT_VERSION}_macos.universal.zip"
              unzip -q -o "$RUNNER_TEMP/godot.zip" -d "$CACHE"
              rm -f "$RUNNER_TEMP/godot.zip"
            fi
            GODOT_BIN="$CACHED_GODOT"
          fi
          chmod +x "$GODOT_BIN"
          "$GODOT_BIN" --version | grep -Fq "$EXPECTED_VERSION"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"

          TEMPLATE_VERSION="${GODOT_VERSION/-/.}"
          TEMPLATE_DIR="$HOME/Library/Application Support/Godot/export_templates/$TEMPLATE_VERSION"
          if [ ! -f "$TEMPLATE_DIR/ios.zip" ]; then
            curl -fL -o "$RUNNER_TEMP/templates.tpz" \
              "https://github.com/godotengine/godot/releases/download/$GODOT_VERSION/Godot_v${GODOT_VERSION}_export_templates.tpz"
            rm -rf "$RUNNER_TEMP/templates"
            mkdir -p "$RUNNER_TEMP/templates" "$(dirname "$TEMPLATE_DIR")"
            unzip -q -o "$RUNNER_TEMP/templates.tpz" -d "$RUNNER_TEMP/templates"
            rm -rf "$TEMPLATE_DIR"
            mv "$RUNNER_TEMP/templates/templates" "$TEMPLATE_DIR"
            rm -f "$RUNNER_TEMP/templates.tpz"
          fi
          test -f "$TEMPLATE_DIR/ios.zip"

          xcodebuild -version
          "$GODOT_BIN" --version

      - name: Require Apple signing secrets
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_DIST_CERT_P12_BASE64: ${{ secrets.APPLE_DIST_CERT_P12_BASE64 }}
          APPLE_DIST_CERT_P12_PASSWORD: ${{ secrets.APPLE_DIST_CERT_P12_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          for name in TEAM_ID DIST_CERT_P12_BASE64 DIST_CERT_P12_PASSWORD PROVISIONING_PROFILE_BASE64 KEYCHAIN_PASSWORD; do
            variable="APPLE_$name"
            value="${!variable}"
            echo "$variable length: ${#value}"
            [ -n "$value" ] || { echo "FATAL: $variable is not configured on this Gitea repository."; exit 1; }
          done
          [ "$APPLE_TEAM_ID" = "$TEAM_ID" ] || {
            echo "FATAL: APPLE_TEAM_ID does not match the committed app contract."
            exit 1
          }

      - name: Require TestFlight API secrets
        if: ${{ inputs.upload_to_testflight == 'true' }}
        env:
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_ISSUER_ID: ${{ secrets.APPLE_ISSUER_ID }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          for name in KEY_ID ISSUER_ID API_KEY_P8_BASE64; do
            variable="APPLE_$name"
            value="${!variable}"
            echo "$variable length: ${#value}"
            [ -n "$value" ] || { echo "FATAL: $variable is not configured on this Gitea repository."; exit 1; }
          done

      - name: Create temporary keychain and import distribution identity
        env:
          APPLE_DIST_CERT_P12_BASE64: ${{ secrets.APPLE_DIST_CERT_P12_BASE64 }}
          APPLE_DIST_CERT_P12_PASSWORD: ${{ secrets.APPLE_DIST_CERT_P12_PASSWORD }}
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')

          P12="$RUNNER_TEMP/distribution.p12"
          printf '%s' "$APPLE_DIST_CERT_P12_BASE64" | openssl base64 -d -A > "$P12"
          security import "$P12" -k "$KEYCHAIN_PATH" -P "$APPLE_DIST_CERT_P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$APPLE_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -F "Apple Distribution"
          rm -f "$P12"
          echo "CI_KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Install and validate provisioning profile
        env:
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          PROFILE="$RUNNER_TEMP/SuchMoonLaunch.mobileprovision"
          PROFILE_PLIST="$RUNNER_TEMP/SuchMoonLaunch-profile.plist"
          printf '%s' "$APPLE_PROVISIONING_PROFILE_BASE64" | openssl base64 -d -A > "$PROFILE"
          security cms -D -i "$PROFILE" > "$PROFILE_PLIST"

          python3 - "$PROFILE_PLIST" "$PROFILE_NAME" "$TEAM_ID" "$BUNDLE_ID" <<'PY'
          import datetime
          import plistlib
          import sys

          path, expected_name, team, bundle = sys.argv[1:]
          with open(path, "rb") as handle:
              profile = plistlib.load(handle)
          entitlements = profile.get("Entitlements", {})
          expected_app_id = f"{team}.{bundle}"
          checks = {
              "profile name": (profile.get("Name"), expected_name),
              "team": ((profile.get("TeamIdentifier") or [""])[0], team),
              "application identifier": (entitlements.get("application-identifier"), expected_app_id),
              "distribution profile": (entitlements.get("get-task-allow"), False),
              "TestFlight eligibility": (entitlements.get("beta-reports-active"), True),
              "Game Center": (entitlements.get("com.apple.developer.game-center"), True),
          }
          for label, (actual, expected) in checks.items():
              if actual != expected:
                  raise SystemExit(f"FATAL: {label}: expected {expected!r}, got {actual!r}")
          expires = profile.get("ExpirationDate")
          now = datetime.datetime.now(datetime.timezone.utc).replace(tzinfo=None)
          if not expires or expires <= now:
              raise SystemExit(f"FATAL: provisioning profile expired or has no expiration: {expires}")
          print(f"Profile PASS: {profile['Name']} ({profile['UUID']}), expires {expires.isoformat()}Z")
          PY

          UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$PROFILE_PLIST")"
          PROFILES_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_DIR"
          PROFILE_DEST="$PROFILES_DIR/$UUID.mobileprovision"
          cp "$PROFILE" "$PROFILE_DEST"
          echo "CI_PROFILE_UUID=$UUID" >> "$GITHUB_ENV"
          echo "CI_PROFILE_PATH=$PROFILE_DEST" >> "$GITHUB_ENV"

      - name: Install App Store Connect API key
        if: ${{ inputs.upload_to_testflight == 'true' }}
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          P8="$HOME/.appstoreconnect/private_keys/AuthKey_${APPLE_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_P8_BASE64" | openssl base64 -d -A > "$P8"
          openssl pkey -in "$P8" -noout || {
            echo "FATAL: App Store Connect API key does not parse."
            exit 1
          }
          echo "CI_ASC_KEY_PATH=$P8" >> "$GITHUB_ENV"

      - name: Resolve iOS build number
        id: release_identity
        env:
          REQUESTED_BUILD_NUMBER: ${{ inputs.build_number }}
          UPLOAD_TO_TESTFLIGHT: ${{ inputs.upload_to_testflight }}
        run: |
          set -euo pipefail
          BUILD_NUMBER="$REQUESTED_BUILD_NUMBER"
          if [ -n "$BUILD_NUMBER" ]; then
            sed -i '' "s#^application/version=\"[^\"]*\"#application/version=\"$BUILD_NUMBER\"#" export_presets.cfg
          else
            BUILD_NUMBER="$(sed -n 's/^application\/version="\([^"]*\)"/\1/p' export_presets.cfg | head -1)"
          fi
          [[ "$BUILD_NUMBER" =~ ^[1-9][0-9]{0,17}$ ]] || {
            echo "FATAL: resolved iOS build number is invalid: $BUILD_NUMBER"
            exit 1
          }
          SHORT_VERSION="$(sed -n 's/^application\/short_version="\([^"]*\)"/\1/p' export_presets.cfg | head -1)"
          [ -n "$SHORT_VERSION" ] || { echo "FATAL: iOS marketing version is empty"; exit 1; }
          echo "IOS_BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "IOS_SHORT_VERSION=$SHORT_VERSION" >> "$GITHUB_ENV"
          echo "did_upload=$UPLOAD_TO_TESTFLIGHT" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "marketing_version=$SHORT_VERSION" >> "$GITHUB_OUTPUT"
          echo "iOS identity requested: $SHORT_VERSION ($BUILD_NUMBER)"

      - name: Import project and run the secret-free gate
        run: bash tools/ci/verify.sh

      - name: Build signed release IPA
        run: |
          set -euo pipefail
          OUT="$PWD/build/ios/SuchMoonLaunch.ipa"
          mkdir -p "$(dirname "$OUT")"
          "$GODOT_BIN" --headless --path . --export-release "iOS" "$OUT" \
            2>&1 | tee "$RUNNER_TEMP/godot-ios-export.log"
          [ -f "$OUT" ] || { echo "FATAL: Godot did not produce the expected IPA."; exit 1; }
          [ -s "$OUT" ] || { echo "FATAL: produced IPA is empty."; exit 1; }
          shasum -a 256 "$OUT" | tee "$OUT.sha256"
          echo "IPA=$OUT" >> "$GITHUB_ENV"

      - name: Inspect final signed IPA against the app contract
        run: |
          set -euo pipefail
          python3 ci/ios-release/inspect_ipa.py \
            --ipa "$IPA" \
            --contract ci/ios-app.json \
            --expected-version "$IOS_SHORT_VERSION" \
            --expected-build "$IOS_BUILD_NUMBER" \
            --expected-profile-uuid "$CI_PROFILE_UUID" \
            --output build/ios/ipa-inspection.json

      - name: Record candidate provenance
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import platform
          import subprocess

          ipa = pathlib.Path(os.environ["IPA"])
          contract_path = pathlib.Path("ci/ios-app.json")
          payload = {
              "schema_version": 1,
              "app": os.environ["APP_NAME"],
              "bundle_id": os.environ["BUNDLE_ID"],
              "source_sha": os.environ.get("SOURCE_SHA", ""),
              "source_ref": os.environ.get("GITHUB_REF", ""),
              "version": os.environ["IOS_SHORT_VERSION"],
              "build_number": os.environ["IOS_BUILD_NUMBER"],
              "minimum_ios": os.environ["MINIMUM_IOS"],
              "profile_name": os.environ["PROFILE_NAME"],
              "profile_uuid": os.environ["CI_PROFILE_UUID"],
              "godot_version": os.environ["GODOT_VERSION"],
              "xcode": subprocess.check_output(["xcodebuild", "-version"], text=True).strip(),
              "runner": platform.platform(),
              "ipa": str(ipa),
              "ipa_size_bytes": ipa.stat().st_size,
              "ipa_sha256": hashlib.sha256(ipa.read_bytes()).hexdigest(),
              "ios_contract_sha256": hashlib.sha256(contract_path.read_bytes()).hexdigest(),
              "ios_release_tool_version": pathlib.Path("ci/ios-release/VERSION").read_text().strip(),
              "ios_release_tooling": json.loads(
                  pathlib.Path("ci/ios-release/tooling.json").read_text()
              ),
          }
          pathlib.Path("build/ios/provenance.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          cat build/ios/provenance.json

      - name: Retain signed candidate
        uses: actions/upload-artifact@v3
        env:
          NODE_TLS_REJECT_UNAUTHORIZED: "0"
        with:
          name: such-moon-launch-ios-${{ github.sha }}-build-${{ env.IOS_BUILD_NUMBER }}
          path: |
            build/ios/SuchMoonLaunch.ipa
            build/ios/SuchMoonLaunch.ipa.sha256
            build/ios/ipa-inspection.json
            build/ios/provenance.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload inspected IPA to TestFlight
        if: ${{ inputs.upload_to_testflight == 'true' }}
        env:
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_ISSUER_ID: ${{ secrets.APPLE_ISSUER_ID }}
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/altool-upload.log"
          set +e
          xcrun altool --upload-app --type ios --file "$IPA" \
            --apiKey "$APPLE_KEY_ID" --apiIssuer "$APPLE_ISSUER_ID" \
            > "$LOG" 2>&1
          RC=$?
          set -e
          cat "$LOG"

          cp "$LOG" build/ios/altool-upload.log
          python3 ci/ios-release/parse_altool_upload.py \
            --log build/ios/altool-upload.log \
            --output build/ios/testflight-receipt.json \
            --ipa "$IPA" \
            --app "$APP_NAME" \
            --bundle-id "$BUNDLE_ID" \
            --version "$IOS_SHORT_VERSION" \
            --build-number "$IOS_BUILD_NUMBER" \
            --source-sha "${GITHUB_SHA:-}" \
            --source-ref "${GITHUB_REF:-}" \
            --exit-code "$RC"
          cat build/ios/testflight-receipt.json

      - name: Retain TestFlight receipt
        if: ${{ always() && inputs.upload_to_testflight == 'true' }}
        uses: actions/upload-artifact@v3
        env:
          NODE_TLS_REJECT_UNAUTHORIZED: "0"
        with:
          name: such-moon-launch-testflight-${{ github.sha }}-build-${{ env.IOS_BUILD_NUMBER }}
          path: |
            build/ios/testflight-receipt.json
            build/ios/altool-upload.log
          if-no-files-found: error
          retention-days: 30

      - name: Cleanup signing material
        if: always()
        run: |
          set +e
          [ -z "${CI_KEYCHAIN_PATH:-}" ] || security delete-keychain "$CI_KEYCHAIN_PATH" 2>/dev/null
          [ -z "${CI_PROFILE_PATH:-}" ] || rm -f "$CI_PROFILE_PATH"
          [ -z "${CI_ASC_KEY_PATH:-}" ] || rm -f "$CI_ASC_KEY_PATH"

  verify_app_store_connect:
    name: Verify asynchronous Apple processing
    needs: candidate
    if: ${{ needs.candidate.outputs.did_upload == 'true' }}
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        env:
          NODE_TLS_REJECT_UNAUTHORIZED: "0"
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Materialize short-lived App Store Connect key
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
        run: |
          set -euo pipefail
          KEY="$RUNNER_TEMP/AuthKey_${APPLE_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_P8_BASE64" | openssl base64 -d -A > "$KEY"
          openssl pkey -in "$KEY" -noout
          echo "APPLE_API_KEY_PATH=$KEY" >> "$GITHUB_ENV"

      - name: Wait for TestFlight readiness and compliance
        env:
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_ISSUER_ID: ${{ secrets.APPLE_ISSUER_ID }}
          BETA_GROUP: ${{ inputs.beta_group }}
          BUILD_NUMBER: ${{ needs.candidate.outputs.build_number }}
          MARKETING_VERSION: ${{ needs.candidate.outputs.marketing_version }}
        run: |
          set -euo pipefail
          mkdir -p build/ios
          args=()
          [ -z "$BETA_GROUP" ] || args=(--beta-group "$BETA_GROUP")
          python3 ci/ios-release/verify_app_store_connect.py \
            --contract ci/ios-app.json \
            --build-number "$BUILD_NUMBER" \
            --marketing-version "$MARKETING_VERSION" \
            --output build/ios/app-store-connect-receipt.json \
            "${args[@]}"

      - name: Retain App Store Connect processing receipt
        if: always()
        uses: actions/upload-artifact@v3
        env:
          NODE_TLS_REJECT_UNAUTHORIZED: "0"
        with:
          name: such-moon-launch-asc-${{ github.sha }}-build-${{ needs.candidate.outputs.build_number }}
          path: build/ios/app-store-connect-receipt.json
          if-no-files-found: error
          retention-days: 30

      - name: Remove App Store Connect key
        if: always()
        run: rm -f "${APPLE_API_KEY_PATH:-$RUNNER_TEMP/nonexistent}"

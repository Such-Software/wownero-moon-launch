<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>$GODOT_PROJECT_NAME</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: $GODOT_SPLASH_COLOR;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

/* --- Ad containers --- */
#ad-banner {
	position: fixed;
	bottom: 0;
	left: 0;
	right: 0;
	text-align: center;
	z-index: 100;
	display: none;
	background: rgba(0,0,0,0.8);
	padding: 4px 0;
}

#ad-interstitial-overlay {
	position: fixed;
	top: 0; left: 0; right: 0; bottom: 0;
	z-index: 200;
	background: rgba(0,0,0,0.85);
	display: none;
	justify-content: center;
	align-items: center;
	flex-direction: column;
}

#ad-interstitial-overlay .ad-close {
	color: white;
	font-size: 14px;
	margin-top: 12px;
	cursor: pointer;
	font-family: sans-serif;
	display: none;
}

/* --- Nag overlay (shown before first game + on demand from Godot) --- */
#nag-overlay {
	position: fixed;
	top: 0; left: 0; right: 0; bottom: 0;
	z-index: 300;
	background: rgba(0, 0, 0, 0.92);
	display: flex;
	justify-content: center;
	align-items: center;
	font-family: 'Noto Sans', Arial, sans-serif;
	padding: 20px;
	box-sizing: border-box;
}
#nag-box {
	max-width: 460px;
	width: 100%;
	background: #0c0c19;
	border: 1px solid rgba(255, 200, 60, 0.4);
	border-radius: 12px;
	padding: 28px 26px;
	color: #e8e8ee;
	text-align: center;
	box-shadow: 0 0 28px rgba(255, 200, 60, 0.18);
}
#nag-title {
	font-size: 28px;
	letter-spacing: 1px;
	margin: 0;
	color: #ffc83c;
}
#nag-tagline {
	margin: 6px 0 18px;
	font-size: 15px;
	color: #cfcfd6;
}
#nag-pitch p {
	margin: 6px 0;
	font-size: 15px;
	line-height: 1.4;
}
#nag-pitch strong {
	color: #ffc83c;
}
#nag-store-links {
	margin: 16px 0 6px;
	display: flex;
	flex-direction: column;
	gap: 10px;
}
.nag-btn {
	display: block;
	padding: 11px 14px;
	border-radius: 8px;
	text-decoration: none;
	font-weight: 600;
	font-size: 15px;
	border: 1px solid transparent;
	cursor: pointer;
	transition: background 120ms, border-color 120ms;
}
.nag-btn-primary {
	background: #ffc83c;
	color: #0c0c19;
}
.nag-btn-primary:hover { background: #ffd66d; }
.nag-btn-store {
	background: transparent;
	color: #e8e8ee;
	border-color: rgba(255, 255, 255, 0.18);
	flex: 1;
}
.nag-btn-store[data-disabled="true"] {
	color: #7a7a82;
	cursor: not-allowed;
	pointer-events: none;
	border-color: rgba(255, 255, 255, 0.08);
}
#nag-mobile-row {
	display: flex;
	gap: 10px;
}
#nag-mobile-row .nag-btn { flex: 1; }
#nag-divider {
	height: 1px;
	background: rgba(255, 255, 255, 0.1);
	margin: 18px 0;
}
#nag-ad-container { min-height: 90px; }
#nag-continue {
	margin-top: 16px;
	background: transparent;
	border: 1px solid rgba(255, 255, 255, 0.2);
	color: #e8e8ee;
	padding: 10px 18px;
	border-radius: 8px;
	font-size: 14px;
	cursor: pointer;
}
#nag-continue:hover { background: rgba(255, 255, 255, 0.05); }
#nag-fine-print {
	margin: 12px 0 0;
	font-size: 11px;
	color: #7a7a82;
}
		</style>
		$GODOT_HEAD_INCLUDE
	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="$GODOT_SPLASH_CLASSES" src="$GODOT_SPLASH" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<!-- ================================================================= -->
		<!--  NAG OVERLAY — shown before first game and on demand from Godot   -->
		<!-- ================================================================= -->
		<div id="nag-overlay">
			<div id="nag-box">
				<h1 id="nag-title">SUCH MOON LAUNCH</h1>
				<p id="nag-tagline">Vry rocket. Much landing. Wow!</p>

				<div id="nag-pitch">
					<p><strong>Now on iOS &amp; Android!</strong></p>
					<p>Get the free app to play anywhere and climb the global leaderboards.</p>
				</div>

				<div id="nag-store-links">
					<div id="nag-mobile-row">
						<a href="https://apps.apple.com/us/app/such-moon-launch/id6767909623"
							target="_blank" rel="noopener noreferrer"
							class="nag-btn nag-btn-store">
							App Store
						</a>
						<a href="https://play.google.com/store/apps/details?id=com.suchsoftware.suchmoonlaunch"
							target="_blank" rel="noopener noreferrer"
							class="nag-btn nag-btn-store">
							Google Play
						</a>
					</div>
				</div>

				<button id="nag-continue" onclick="dismissNagOverlay()">
					Continue to web version
				</button>

				<p id="nag-fine-print">Free to play in your browser</p>
			</div>
		</div>

		<!-- NOTE: Web monetization is handled by the in-game nag (Godot
		     AdManager), not AdSense. The old AdSense placeholders + JS bridge
		     were never configured and are unused, so they were removed. -->

		<script>
		// Pre-game splash overlay. Dismissed by the "Continue to web version"
		// button. (Web monetization / cross-promo is the in-game Godot nag, so
		// there is no JS ad bridge here.)
		window.dismissNagOverlay = function() {
			var overlay = document.getElementById('nag-overlay');
			if (overlay) overlay.style.display = 'none';
		};
		</script>

		<script src="$GODOT_URL"></script>
		<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>

name: Such Moon Launch iOS candidate / TestFlight

# Gitea-only private-Mac release lane. A dispatch builds, signs, inspects,
# checksums, and retains an IPA by default. TestFlight delivery additionally
# requires an unused build number, successful Apple processing, and assignment
# to the configured internal tester group.
on:
  workflow_dispatch:
    inputs:
      upload_to_testflight:
        description: "Upload the inspected IPA to TestFlight (main only)"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      build_number:
        description: "Positive iOS build number; required and above the committed baseline for upload"
        required: false
        default: ""
        type: string

concurrency:
  group: such-moon-launch-ios-delivery
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  GODOT_VERSION: "4.6.1-stable"
  APP_NAME: "Such Moon Launch"
  BUNDLE_ID: "com.suchsoftware.suchmoonlaunch"
  TEAM_ID: "D8PL9F7X33"
  PROFILE_NAME: "SuchMoonLaunch_AppStore"
  MINIMUM_IOS: "14.0"

jobs:
  candidate:
    # Fleet's canonical Mac capability label must resolve only to the
    # locked-down Apple Silicon release runner, never a hosted runner.
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          lfs: false
          submodules: false
          persist-credentials: false

      - name: Check official App Platform policy
        run: |
          python3 tools/check_app_platform.py --expect-app moon_launch
          python3 tools/ci/check_app_platform_baseline.py

      - name: Initialize isolated Build workspace
        run: |
          set -euo pipefail
          umask 077
          BASE="$HOME/Build/such-moon-launch/ci"
          mkdir -p "$BASE"
          RUN_ROOT="$(mktemp -d "$BASE/run-${GITHUB_RUN_ID:-manual}-XXXXXX")"
          PRODUCT_DIR="$RUN_ROOT/products"
          LOG_DIR="$RUN_ROOT/logs"
          PROJECT_CACHE="$RUN_ROOT/project-cache"
          SECRET_DIR="$(mktemp -d "$RUNNER_TEMP/such-moon-launch-signing.XXXXXX")"
          mkdir -p "$PRODUCT_DIR" "$LOG_DIR" "$PROJECT_CACHE"
          chmod 700 "$RUN_ROOT" "$SECRET_DIR"
          [ ! -e .godot ] && [ ! -L .godot ] || {
            echo "FATAL: checkout unexpectedly contains a project cache."
            exit 1
          }
          ln -s "$PROJECT_CACHE" .godot
          {
            echo "SML_CI_BUILD_ROOT=$RUN_ROOT"
            echo "SML_PRODUCT_DIR=$PRODUCT_DIR"
            echo "SML_LOG_DIR=$LOG_DIR"
            echo "SML_PROJECT_CACHE=$PROJECT_CACHE"
            echo "SML_SECRET_DIR=$SECRET_DIR"
            echo "SML_BUILD_ROOT=$HOME/Build/such-moon-launch"
          } >> "$GITHUB_ENV"
          echo "Disposable run root: $RUN_ROOT"

      - name: Validate request and committed release contract
        env:
          UPLOAD_TO_TESTFLIGHT: ${{ inputs.upload_to_testflight }}
          REQUESTED_BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          set -euo pipefail
          python3 tools/ci/check_release_contract.py

          case "$UPLOAD_TO_TESTFLIGHT" in
            true|false) ;;
            *) echo "FATAL: upload_to_testflight must be true or false"; exit 1 ;;
          esac

          if [ -n "$REQUESTED_BUILD_NUMBER" ] && ! [[ "$REQUESTED_BUILD_NUMBER" =~ ^[1-9][0-9]{0,17}$ ]]; then
            echo "FATAL: build_number must be a positive integer of at most 18 digits"
            exit 1
          fi

          [ "${GITHUB_REF:-}" = "refs/heads/main" ] || {
            echo "FATAL: signed Such Moon Launch candidates are allowed only from the reviewed Builds main ref."
            echo "Current ref: ${GITHUB_REF:-unset}"
            exit 1
          }
          if [ "$UPLOAD_TO_TESTFLIGHT" = "true" ]; then
            [ -n "$REQUESTED_BUILD_NUMBER" ] || {
              echo "FATAL: TestFlight upload requires an explicit, reviewed, never-before-used build_number."
              exit 1
            }
            BASELINE="$(sed -n 's/^application\/version="\([^"]*\)"/\1/p' export_presets.cfg | head -1)"
            [ "$REQUESTED_BUILD_NUMBER" -gt "$BASELINE" ] || {
              echo "FATAL: upload build $REQUESTED_BUILD_NUMBER must exceed committed baseline $BASELINE."
              exit 1
            }
          fi

          echo "request accepted: ref=${GITHUB_REF:-unset} upload=$UPLOAD_TO_TESTFLIGHT build=${REQUESTED_BUILD_NUMBER:-committed}"

      - name: Verify and overlay declared iOS seed
        run: |
          set -euo pipefail
          SEED="$HOME/Build/such-moon-launch/cache/ios-seed"
          python3 tools/ci/seed_manifest.py --root "$SEED"

          mkdir -p ios/framework ios/plugins
          rsync -a --delete "$SEED/ios/framework/" ios/framework/
          cp "$SEED/ios/plugins/AdmobPlugin.gdip" ios/plugins/AdmobPlugin.gdip
          for bundle in \
            AdmobPlugin.debug.xcframework \
            AdmobPlugin.release.xcframework \
            BloomwordFirebase.debug.xcframework \
            BloomwordFirebase.release.xcframework; do
            rm -rf "ios/plugins/$bundle"
            mkdir -p "ios/plugins/$bundle"
            rsync -a --delete "$SEED/ios/plugins/$bundle/" "ios/plugins/$bundle/"
          done
          cp "$SEED/ios/plugins/GoogleService-Info.plist" ios/plugins/GoogleService-Info.plist
          cp "$SEED/ios/GoogleService-Info.plist" ios/GoogleService-Info.plist

          # Re-hash the materialized checkout, not just the source cache.
          python3 tools/ci/seed_manifest.py --root .
          while IFS= read -r -d '' xcframework; do
            if /usr/bin/codesign -d "$xcframework" >/dev/null 2>&1; then
              /usr/bin/codesign --verify --deep --strict --verbose=2 "$xcframework" || {
                echo "FATAL: signed XCFramework fails strict verification: $xcframework"
                exit 1
              }
            elif [[ "$xcframework" == ios/framework/* ]]; then
              echo "FATAL: vendor XCFramework is unsigned: $xcframework"
              exit 1
            else
              echo "Unsigned static app plugin accepted: $xcframework"
            fi
          done < <(
            find ios/framework ios/plugins -type d -name '*.xcframework' -prune -print0
          )
          echo "PASS strict XCFramework signature verification"
          echo "IOS_SEED_ROOT=$SEED" >> "$GITHUB_ENV"

      - name: Locate Godot and install matching iOS templates
        run: |
          set -euo pipefail
          CACHE="$HOME/Build/such-moon-launch/cache/toolchain/$GODOT_VERSION"
          ARCHIVE="$CACHE/Godot_v${GODOT_VERSION}_macos.universal.zip"
          TEMPLATES_ARCHIVE="$CACHE/Godot_v${GODOT_VERSION}_export_templates.tpz"
          GODOT_SHA512="59c7fc792c9a7a9b3c877b43fc6bdedfa3618e90f0d7d5fa77edb8d3bd64568af19bdfa6ecc8ec3eeaa17ad9cb65f7c93760de83b485ae4a33a679e730f7ffd9"
          TEMPLATES_SHA512="d80001711c07973b1fd3e88077ba99644e19db7c9e52627e16f38a2937879f809f94dbd8493936fb8204908bbc57a521d41173dce5208061fe4c99772490c541"
          EXPECTED_VERSION="${GODOT_VERSION/-/.}"

          mkdir -p "$CACHE"
          if [ ! -f "$ARCHIVE" ]; then
            curl --fail --location --proto '=https' --tlsv1.2 \
              --output "$ARCHIVE.partial" \
              "https://github.com/godotengine/godot/releases/download/$GODOT_VERSION/$(basename "$ARCHIVE")"
            mv "$ARCHIVE.partial" "$ARCHIVE"
          fi
          printf '%s  %s\n' "$GODOT_SHA512" "$ARCHIVE" | shasum -a 512 --check

          GODOT_DIR="$SML_CI_BUILD_ROOT/toolchain/godot"
          mkdir -p "$GODOT_DIR"
          unzip -q "$ARCHIVE" -d "$GODOT_DIR"
          GODOT_BIN="$GODOT_DIR/Godot.app/Contents/MacOS/Godot"
          # Keep editor data, settings, caches, app_userdata, and export
          # templates inside this disposable Build-rooted editor installation.
          touch "$GODOT_DIR/Godot.app/Contents/MacOS/_sc_"
          chmod +x "$GODOT_BIN"
          "$GODOT_BIN" --version | grep -Fq "$EXPECTED_VERSION"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"

          TEMPLATE_VERSION="${GODOT_VERSION/-/.}"
          # On macOS, a self-contained app bundle resolves editor_data beside
          # Godot.app, even though the _sc_ marker lives beside the executable.
          TEMPLATE_DIR="$GODOT_DIR/editor_data/export_templates/$TEMPLATE_VERSION"
          if [ ! -f "$TEMPLATES_ARCHIVE" ]; then
            curl --fail --location --proto '=https' --tlsv1.2 \
              --output "$TEMPLATES_ARCHIVE.partial" \
              "https://github.com/godotengine/godot/releases/download/$GODOT_VERSION/$(basename "$TEMPLATES_ARCHIVE")"
            mv "$TEMPLATES_ARCHIVE.partial" "$TEMPLATES_ARCHIVE"
          fi
          printf '%s  %s\n' "$TEMPLATES_SHA512" "$TEMPLATES_ARCHIVE" | shasum -a 512 --check
          TEMPLATE_STAGE="$SML_CI_BUILD_ROOT/toolchain/templates"
          mkdir -p "$TEMPLATE_STAGE" "$(dirname "$TEMPLATE_DIR")"
          unzip -q "$TEMPLATES_ARCHIVE" -d "$TEMPLATE_STAGE"
          [ ! -e "$TEMPLATE_DIR" ] || {
            echo "FATAL: disposable Godot template destination already exists."
            exit 1
          }
          mv "$TEMPLATE_STAGE/templates" "$TEMPLATE_DIR"
          test -f "$TEMPLATE_DIR/ios.zip"

          XCODE_VERSION="$(xcodebuild -version)"
          XCODE_MAJOR="$(sed -nE 's/^Xcode ([0-9]+).*/\1/p' <<<"$XCODE_VERSION")"
          SDK_VERSION="$(xcrun --sdk iphoneos --show-sdk-version)"
          SDK_MAJOR="${SDK_VERSION%%.*}"
          [[ "$XCODE_MAJOR" =~ ^[0-9]+$ ]] && [ "$XCODE_MAJOR" -ge 26 ] || {
            echo "FATAL: App Store uploads require Xcode 26 or newer; found: $XCODE_VERSION"
            exit 1
          }
          [[ "$SDK_MAJOR" =~ ^[0-9]+$ ]] && [ "$SDK_MAJOR" -ge 26 ] || {
            echo "FATAL: App Store uploads require the iOS 26 SDK or newer; found: $SDK_VERSION"
            exit 1
          }
          echo "IOS_SDK_VERSION=$SDK_VERSION" >> "$GITHUB_ENV"
          echo "$XCODE_VERSION"
          echo "iPhoneOS SDK $SDK_VERSION"
          "$GODOT_BIN" --version

      - name: Require Apple signing secrets
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_DIST_CERT_P12_BASE64: ${{ secrets.APPLE_DIST_CERT_P12_BASE64 }}
          APPLE_DIST_CERT_P12_PASSWORD: ${{ secrets.APPLE_DIST_CERT_P12_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          for name in TEAM_ID DIST_CERT_P12_BASE64 DIST_CERT_P12_PASSWORD PROVISIONING_PROFILE_BASE64 KEYCHAIN_PASSWORD; do
            variable="APPLE_$name"
            value="${!variable}"
            [ -n "$value" ] || { echo "FATAL: $variable is not configured on this Gitea repository."; exit 1; }
          done
          [ "$APPLE_TEAM_ID" = "$TEAM_ID" ] || {
            echo "FATAL: APPLE_TEAM_ID does not match the committed app contract."
            exit 1
          }

      - name: Require TestFlight API secrets
        if: ${{ inputs.upload_to_testflight == 'true' }}
        env:
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_ISSUER_ID: ${{ secrets.APPLE_ISSUER_ID }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_BETA_GROUP_ID: ${{ secrets.APPLE_BETA_GROUP_ID }}
        run: |
          set -euo pipefail
          for name in KEY_ID ISSUER_ID API_KEY_P8_BASE64 BETA_GROUP_ID; do
            variable="APPLE_$name"
            value="${!variable}"
            [ -n "$value" ] || { echo "FATAL: $variable is not configured on this Gitea repository."; exit 1; }
          done
          [[ "$APPLE_BETA_GROUP_ID" =~ ^[A-Za-z0-9-]+$ ]] || {
            echo "FATAL: APPLE_BETA_GROUP_ID contains unexpected characters."
            exit 1
          }

      - name: Create temporary keychain and import distribution identity
        env:
          APPLE_DIST_CERT_P12_BASE64: ${{ secrets.APPLE_DIST_CERT_P12_BASE64 }}
          APPLE_DIST_CERT_P12_PASSWORD: ${{ secrets.APPLE_DIST_CERT_P12_PASSWORD }}
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          KEYCHAIN_PATH="$SML_SECRET_DIR/build.keychain-db"
          ORIGINAL_KEYCHAINS="$SML_SECRET_DIR/original-keychains.txt"
          P12="$SML_SECRET_DIR/distribution.p12"
          CERT_PEM="$SML_SECRET_DIR/distribution-cert.pem"
          {
            echo "CI_KEYCHAIN_PATH=$KEYCHAIN_PATH"
            echo "CI_ORIGINAL_KEYCHAINS=$ORIGINAL_KEYCHAINS"
            echo "CI_CERT_PEM=$CERT_PEM"
          } >> "$GITHUB_ENV"

          security list-keychains -d user | python3 -c \
            'import shlex, sys; print(*shlex.split(sys.stdin.read()), sep="\n")' \
            > "$ORIGINAL_KEYCHAINS"
          security create-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          ORIGINAL_PATHS=()
          while IFS= read -r path; do
            [ -z "$path" ] || ORIGINAL_PATHS+=("$path")
          done < "$ORIGINAL_KEYCHAINS"
          [ "${#ORIGINAL_PATHS[@]}" -gt 0 ] || {
            echo "FATAL: the release account has no original user keychain search list."
            exit 1
          }
          security list-keychains -d user -s \
            "$KEYCHAIN_PATH" "${ORIGINAL_PATHS[@]}" /Library/Keychains/System.keychain

          printf '%s' "$APPLE_DIST_CERT_P12_BASE64" | openssl base64 -d -A > "$P12"
          chmod 600 "$P12"
          openssl pkcs12 -legacy -in "$P12" -clcerts -nokeys \
            -passin env:APPLE_DIST_CERT_P12_PASSWORD -out "$CERT_PEM"
          openssl x509 -in "$CERT_PEM" -checkend 2592000 -noout || {
            echo "FATAL: distribution certificate expires in less than 30 days."
            exit 1
          }
          CERT_SUBJECT="$(openssl x509 -in "$CERT_PEM" -subject -nameopt RFC2253 -noout)"
          grep -Fq "OU=$TEAM_ID" <<<"$CERT_SUBJECT" || {
            echo "FATAL: distribution certificate belongs to a different Apple team."
            exit 1
          }
          grep -Fq "CN=Apple Distribution:" <<<"$CERT_SUBJECT" || {
            echo "FATAL: P12 does not contain an Apple Distribution certificate."
            exit 1
          }
          CERT_SHA256="$(openssl x509 -in "$CERT_PEM" -outform der | shasum -a 256 | awk '{print $1}')"
          echo "CI_CERT_SHA256=$CERT_SHA256" >> "$GITHUB_ENV"

          security import "$P12" -k "$KEYCHAIN_PATH" -P "$APPLE_DIST_CERT_P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$APPLE_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          IDENTITY_OUTPUT="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH")"
          printf '%s\n' "$IDENTITY_OUTPUT"
          grep -Fq "Apple Distribution" <<<"$IDENTITY_OUTPUT" || {
            echo "FATAL: imported Apple Distribution identity is not valid for code signing."
            exit 1
          }
          rm -f "$P12"

      - name: Install and validate provisioning profile
        env:
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          PROFILE="$SML_SECRET_DIR/SuchMoonLaunch.mobileprovision"
          PROFILE_PLIST="$SML_SECRET_DIR/SuchMoonLaunch-profile.plist"
          {
            echo "CI_PROFILE_TEMP_PATH=$PROFILE"
            echo "CI_PROFILE_PLIST_PATH=$PROFILE_PLIST"
          } >> "$GITHUB_ENV"
          printf '%s' "$APPLE_PROVISIONING_PROFILE_BASE64" | openssl base64 -d -A > "$PROFILE"
          chmod 600 "$PROFILE"
          security cms -D -i "$PROFILE" > "$PROFILE_PLIST"

          python3 - "$PROFILE_PLIST" "$PROFILE_NAME" "$TEAM_ID" "$BUNDLE_ID" "$CI_CERT_SHA256" <<'PY'
          import datetime
          import hashlib
          import plistlib
          import sys

          path, expected_name, team, bundle, certificate_sha256 = sys.argv[1:]
          with open(path, "rb") as handle:
              profile = plistlib.load(handle)
          entitlements = profile.get("Entitlements", {})
          expected_app_id = f"{team}.{bundle}"
          checks = {
              "profile name": (profile.get("Name"), expected_name),
              "team": ((profile.get("TeamIdentifier") or [""])[0], team),
              "application identifier": (entitlements.get("application-identifier"), expected_app_id),
              "distribution profile": (entitlements.get("get-task-allow"), False),
              "TestFlight eligibility": (entitlements.get("beta-reports-active"), True),
              "Game Center": (entitlements.get("com.apple.developer.game-center"), True),
          }
          for label, (actual, expected) in checks.items():
              if actual != expected:
                  raise SystemExit(f"FATAL: {label}: expected {expected!r}, got {actual!r}")
          expires = profile.get("ExpirationDate")
          now = datetime.datetime.now(datetime.timezone.utc).replace(tzinfo=None)
          minimum_expiry = now + datetime.timedelta(days=30)
          if not expires or expires <= minimum_expiry:
              raise SystemExit(
                  f"FATAL: provisioning profile expires in less than 30 days: {expires}"
              )
          profile_certificates = {
              hashlib.sha256(certificate).hexdigest()
              for certificate in profile.get("DeveloperCertificates", [])
          }
          if certificate_sha256 not in profile_certificates:
              raise SystemExit(
                  "FATAL: imported distribution certificate is not authorized by this profile"
              )
          print(f"Profile PASS: {profile['Name']} ({profile['UUID']}), expires {expires.isoformat()}Z")
          PY

          UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$PROFILE_PLIST")"
          PROFILES_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_DIR"
          PROFILE_DEST="$PROFILES_DIR/$UUID.mobileprovision"
          echo "CI_PROFILE_PATH=$PROFILE_DEST" >> "$GITHUB_ENV"
          if [ -e "$PROFILE_DEST" ]; then
            cmp -s "$PROFILE" "$PROFILE_DEST" || {
              echo "FATAL: a different provisioning profile already occupies UUID $UUID."
              exit 1
            }
            echo "CI_PROFILE_CREATED=false" >> "$GITHUB_ENV"
          else
            cp "$PROFILE" "$PROFILE_DEST"
            chmod 600 "$PROFILE_DEST"
            echo "CI_PROFILE_CREATED=true" >> "$GITHUB_ENV"
          fi
          echo "CI_PROFILE_UUID=$UUID" >> "$GITHUB_ENV"

      - name: Install App Store Connect API key
        if: ${{ inputs.upload_to_testflight == 'true' }}
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$SML_SECRET_DIR/private_keys"
          P8="$SML_SECRET_DIR/private_keys/AuthKey_${APPLE_KEY_ID}.p8"
          echo "CI_ASC_KEY_PATH=$P8" >> "$GITHUB_ENV"
          printf '%s' "$APPLE_API_KEY_P8_BASE64" | openssl base64 -d -A > "$P8"
          chmod 600 "$P8"
          openssl pkey -in "$P8" -noout || {
            echo "FATAL: App Store Connect API key does not parse."
            exit 1
          }

      - name: Resolve iOS build number
        env:
          REQUESTED_BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          set -euo pipefail
          BUILD_NUMBER="$REQUESTED_BUILD_NUMBER"
          if [ -n "$BUILD_NUMBER" ]; then
            sed -i '' "s#^application/version=\"[^\"]*\"#application/version=\"$BUILD_NUMBER\"#" export_presets.cfg
          else
            BUILD_NUMBER="$(sed -n 's/^application\/version="\([^"]*\)"/\1/p' export_presets.cfg | head -1)"
          fi
          [[ "$BUILD_NUMBER" =~ ^[1-9][0-9]{0,17}$ ]] || {
            echo "FATAL: resolved iOS build number is invalid: $BUILD_NUMBER"
            exit 1
          }
          SHORT_VERSION="$(sed -n 's/^application\/short_version="\([^"]*\)"/\1/p' export_presets.cfg | head -1)"
          [ -n "$SHORT_VERSION" ] || { echo "FATAL: iOS marketing version is empty"; exit 1; }
          echo "IOS_BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "IOS_SHORT_VERSION=$SHORT_VERSION" >> "$GITHUB_ENV"
          echo "iOS identity requested: $SHORT_VERSION ($BUILD_NUMBER)"

      - name: Require an unused App Store Connect build number
        if: ${{ inputs.upload_to_testflight == 'true' }}
        env:
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_ISSUER_ID: ${{ secrets.APPLE_ISSUER_ID }}
        run: |
          set -euo pipefail
          python3 tools/ci/app_store_connect.py check-unused \
            --key-id "$APPLE_KEY_ID" \
            --issuer-id "$APPLE_ISSUER_ID" \
            --private-key "$CI_ASC_KEY_PATH" \
            --bundle-id "$BUNDLE_ID" \
            --marketing-version "$IOS_SHORT_VERSION" \
            --build-number "$IOS_BUILD_NUMBER"

      - name: Import project and run the secret-free gate
        run: bash tools/ci/verify.sh

      - name: Build signed release IPA
        env:
          SUCH_APP_IDP_TICKET_URL: ${{ vars.SUCH_APP_IDP_TICKET_URL }}
          SUCH_APP_NAKAMA_ENDPOINT: ${{ vars.SUCH_APP_NAKAMA_ENDPOINT }}
          SUCH_APP_NAKAMA_SERVER_KEY: ${{ vars.SUCH_APP_NAKAMA_SERVER_KEY }}
        run: |
          set -euo pipefail
          for NAME in SUCH_APP_IDP_TICKET_URL SUCH_APP_NAKAMA_ENDPOINT \
                      SUCH_APP_NAKAMA_SERVER_KEY; do
            [ -n "${!NAME}" ] || { echo "FATAL: repository variable $NAME is empty."; exit 1; }
          done
          OUT="$SML_PRODUCT_DIR/SuchMoonLaunch.ipa"
          mkdir -p "$(dirname "$OUT")"
          # The client reads ProjectSettings("such/app_platform/*") and falls back
          # to the environment, which does not exist on a device. Write those
          # settings for the export only, and restore on any exit so the key is
          # never left behind in a cached checkout.
          PROJECT_BACKUP="$(mktemp "${TMPDIR:-/tmp}/sml-project-godot.XXXXXX")"
          cp -- project.godot "$PROJECT_BACKUP"
          restore_project() { mv -f -- "$PROJECT_BACKUP" project.godot; }
          trap restore_project EXIT
          python3 tools/ci/inject_platform_config.py --project project.godot --release
          "$GODOT_BIN" --headless --path . --export-release "iOS" "$OUT" \
            2>&1 | tee "$SML_LOG_DIR/godot-ios-export.log"
          [ -f "$OUT" ] || { echo "FATAL: Godot did not produce the expected IPA."; exit 1; }
          [ -s "$OUT" ] || { echo "FATAL: produced IPA is empty."; exit 1; }
          shasum -a 256 "$OUT" | tee "$OUT.sha256"
          echo "IPA=$OUT" >> "$GITHUB_ENV"

      - name: Inspect signed IPA identity, signature, entitlements, and payload
        run: |
          set -euo pipefail
          INSPECT="$SML_CI_BUILD_ROOT/inspection"
          mkdir -p "$INSPECT"
          unzip -q "$IPA" -d "$INSPECT"
          APP="$(find "$INSPECT/Payload" -maxdepth 1 -type d -name '*.app' -print -quit)"
          [ -n "$APP" ] || { echo "FATAL: IPA has no .app payload."; exit 1; }
          INFO="$APP/Info.plist"
          [ -f "$INFO" ] || { echo "FATAL: app has no Info.plist."; exit 1; }

          read_plist() { /usr/libexec/PlistBuddy -c "Print :$1" "$INFO"; }
          ACTUAL_BUNDLE="$(read_plist CFBundleIdentifier)"
          ACTUAL_VERSION="$(read_plist CFBundleShortVersionString)"
          ACTUAL_BUILD="$(read_plist CFBundleVersion)"
          ACTUAL_MINIMUM="$(read_plist MinimumOSVersion)"
          EXECUTABLE_NAME="$(read_plist CFBundleExecutable)"
          EXECUTABLE="$APP/$EXECUTABLE_NAME"
          echo "IPA identity: $ACTUAL_BUNDLE $ACTUAL_VERSION ($ACTUAL_BUILD), iOS $ACTUAL_MINIMUM+"
          [ "$ACTUAL_BUNDLE" = "$BUNDLE_ID" ] || { echo "FATAL: wrong IPA bundle identifier."; exit 1; }
          [ "$ACTUAL_VERSION" = "$IOS_SHORT_VERSION" ] || { echo "FATAL: wrong IPA marketing version."; exit 1; }
          [ "$ACTUAL_BUILD" = "$IOS_BUILD_NUMBER" ] || { echo "FATAL: wrong IPA build number."; exit 1; }
          [ "$ACTUAL_MINIMUM" = "$MINIMUM_IOS" ] || { echo "FATAL: wrong IPA minimum iOS."; exit 1; }
          [ "$(read_plist ITSAppUsesNonExemptEncryption)" = "false" ] || {
            echo "FATAL: final IPA must declare ITSAppUsesNonExemptEncryption=false."
            exit 1
          }
          [ -x "$EXECUTABLE" ] || { echo "FATAL: IPA executable is missing."; exit 1; }
          [ -s "$APP/embedded.mobileprovision" ] || { echo "FATAL: embedded provisioning profile is missing."; exit 1; }

          codesign --verify --deep --strict --verbose=2 "$APP"
          ENTITLEMENTS="$SML_LOG_DIR/signed-entitlements.plist"
          codesign -d --entitlements :- "$APP" > "$ENTITLEMENTS"
          python3 - "$ENTITLEMENTS" "$TEAM_ID" "$BUNDLE_ID" <<'PY'
          import plistlib
          import sys

          path, team, bundle = sys.argv[1:]
          with open(path, "rb") as handle:
              entitlements = plistlib.load(handle)
          expected = {
              "application-identifier": f"{team}.{bundle}",
              "com.apple.developer.team-identifier": team,
              "beta-reports-active": True,
              "com.apple.developer.game-center": True,
          }
          for key, value in expected.items():
              if entitlements.get(key) != value:
                  raise SystemExit(
                      f"FATAL: signed entitlement {key}: expected {value!r}, "
                      f"got {entitlements.get(key)!r}"
                  )
          print("signed entitlements: PASS")
          PY

          EMBEDDED_PLIST="$SML_LOG_DIR/embedded-profile.plist"
          security cms -D -i "$APP/embedded.mobileprovision" > "$EMBEDDED_PLIST"
          EMBEDDED_UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$EMBEDDED_PLIST")"
          [ "$EMBEDDED_UUID" = "$CI_PROFILE_UUID" ] || {
            echo "FATAL: signed app embeds a different provisioning profile."
            exit 1
          }

          python3 - "$APP" ci/ios-app.json <<'PY'
          import json
          import pathlib
          import plistlib
          import sys

          app = pathlib.Path(sys.argv[1])
          contract = json.loads(pathlib.Path(sys.argv[2]).read_text())
          names = {path.name for path in app.rglob("*") if path.is_file()}
          for required in contract["required_payload_names"]:
              if required not in names:
                  raise SystemExit(f"FATAL: required signed payload is missing: {required}")
              print(f"payload PASS: {required}")
          manifests = list(app.rglob("PrivacyInfo.xcprivacy"))
          for manifest in manifests:
              try:
                  with manifest.open("rb") as handle:
                      payload = plistlib.load(handle)
              except Exception as error:
                  raise SystemExit(
                      f"FATAL: invalid privacy manifest {manifest.relative_to(app)}: {error}"
                  ) from error
              if not isinstance(payload, dict):
                  raise SystemExit(
                      f"FATAL: privacy manifest is not a dictionary: {manifest.relative_to(app)}"
                  )
          for expected in contract["required_privacy_manifests"]:
              relative = expected["relative_path"]
              manifest = app / relative
              if not manifest.is_file():
                  raise SystemExit(f"FATAL: required privacy manifest is missing: {relative}")
              with manifest.open("rb") as handle:
                  payload = plistlib.load(handle)
              if "tracking" in expected and payload.get("NSPrivacyTracking") is not expected["tracking"]:
                  raise SystemExit(
                      f"FATAL: {relative} NSPrivacyTracking does not match the contract"
                  )
              declarations = {
                  item.get("NSPrivacyCollectedDataType"): item
                  for item in payload.get("NSPrivacyCollectedDataTypes", [])
                  if isinstance(item, dict)
              }
              missing_types = set(expected.get("collected_data_types", [])) - set(declarations)
              if missing_types:
                  raise SystemExit(
                      f"FATAL: {relative} is missing collected data declarations: "
                      + ", ".join(sorted(missing_types))
                  )
              for data_type in expected.get("tracking_data_types", []):
                  if declarations[data_type].get("NSPrivacyCollectedDataTypeTracking") is not True:
                      raise SystemExit(
                          f"FATAL: {relative} must mark {data_type} as used for tracking"
                      )
              print(f"privacy contract PASS: {relative}")
          print(f"privacy manifests: PASS ({len(manifests)} valid plist files)")
          PY

          SYMBOLS_FILE="$SML_LOG_DIR/native-symbols.txt"
          nm -gU "$EXECUTABLE" > "$SYMBOLS_FILE"
          python3 - "$SYMBOLS_FILE" ci/ios-app.json <<'PY'
          import json
          import pathlib
          import sys

          symbols = pathlib.Path(sys.argv[1]).read_text(errors="replace")
          contract = json.loads(pathlib.Path(sys.argv[2]).read_text())
          for required in contract["required_linked_symbols"]:
              if required not in symbols:
                  raise SystemExit(f"FATAL: required native plugin symbol is missing: {required}")
              print(f"native link PASS: {required}")
          PY

          echo "CI_APP_PATH=$APP" >> "$GITHUB_ENV"

      - name: Record candidate provenance
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import platform
          import subprocess

          ipa = pathlib.Path(os.environ["IPA"])
          contract_path = pathlib.Path("ci/ios-app.json")
          provenance_path = pathlib.Path(os.environ["SML_PRODUCT_DIR"]) / "provenance.json"
          payload = {
              "schema_version": 1,
              "app": os.environ["APP_NAME"],
              "bundle_id": os.environ["BUNDLE_ID"],
              "source_sha": os.environ.get("SOURCE_SHA", ""),
              "source_ref": os.environ.get("GITHUB_REF", ""),
              "version": os.environ["IOS_SHORT_VERSION"],
              "build_number": os.environ["IOS_BUILD_NUMBER"],
              "minimum_ios": os.environ["MINIMUM_IOS"],
              "profile_name": os.environ["PROFILE_NAME"],
              "profile_uuid": os.environ["CI_PROFILE_UUID"],
              "godot_version": os.environ["GODOT_VERSION"],
              "xcode": subprocess.check_output(["xcodebuild", "-version"], text=True).strip(),
              "iphoneos_sdk": os.environ["IOS_SDK_VERSION"],
              "runner": platform.platform(),
              "ipa": str(ipa),
              "ipa_size_bytes": ipa.stat().st_size,
              "ipa_sha256": hashlib.sha256(ipa.read_bytes()).hexdigest(),
              "ios_contract_sha256": hashlib.sha256(contract_path.read_bytes()).hexdigest(),
          }
          provenance_path.write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          cat "$SML_PRODUCT_DIR/provenance.json"

      - name: Retain signed candidate
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3.2.1
        with:
          name: such-moon-launch-ios-${{ github.sha }}-build-${{ env.IOS_BUILD_NUMBER }}
          path: |
            ${{ env.SML_PRODUCT_DIR }}/SuchMoonLaunch.ipa
            ${{ env.SML_PRODUCT_DIR }}/SuchMoonLaunch.ipa.sha256
            ${{ env.SML_PRODUCT_DIR }}/provenance.json
          if-no-files-found: error
          retention-days: 30

      - name: Validate and upload inspected IPA to TestFlight
        if: ${{ inputs.upload_to_testflight == 'true' }}
        env:
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_ISSUER_ID: ${{ secrets.APPLE_ISSUER_ID }}
        run: |
          set -euo pipefail
          VALIDATE_LOG="$SML_LOG_DIR/altool-validate.log"
          LOG="$SML_LOG_DIR/altool-upload.log"
          set +e
          (
            cd "$SML_SECRET_DIR"
            xcrun altool --validate-app --type ios --file "$IPA" \
              --apiKey "$APPLE_KEY_ID" --apiIssuer "$APPLE_ISSUER_ID"
          ) > "$VALIDATE_LOG" 2>&1
          VALIDATE_RC=$?
          set -e
          cat "$VALIDATE_LOG"
          [ "$VALIDATE_RC" -eq 0 ] || {
            echo "FATAL: altool validation failed with exit $VALIDATE_RC."
            exit "$VALIDATE_RC"
          }

          set +e
          (
            cd "$SML_SECRET_DIR"
            xcrun altool --upload-app --type ios --file "$IPA" \
              --apiKey "$APPLE_KEY_ID" --apiIssuer "$APPLE_ISSUER_ID"
          ) > "$LOG" 2>&1
          RC=$?
          set -e
          cat "$LOG"

          [ "$RC" -eq 0 ] || {
            echo "FATAL: altool upload failed with exit $RC."
            exit "$RC"
          }
          if ! grep -qiE 'No errors uploading|UPLOAD SUCCEEDED|successfully uploaded' "$LOG"; then
            echo "FATAL: altool exited successfully but did not report positive upload acceptance."
            exit 1
          fi
          if grep -qiE '(^|[^A-Z])(ERROR|FAILED|FAILURE)([^A-Z]|$)' "$LOG"; then
            echo "FATAL: altool emitted an error/failure marker despite a success-like line."
            exit 1
          fi

          DELIVERY_UUID="$(sed -nE \
            's/.*(Delivery UUID|RequestUUID|Request UUID)[^0-9A-Fa-f]*([0-9A-Fa-f-]{36}).*/\2/p' \
            "$LOG" | head -1)"
          echo "DELIVERY_UUID=$DELIVERY_UUID" >> "$GITHUB_ENV"

      - name: Wait for Apple processing and distribute to internal testers
        if: ${{ inputs.upload_to_testflight == 'true' }}
        env:
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_ISSUER_ID: ${{ secrets.APPLE_ISSUER_ID }}
          APPLE_BETA_GROUP_ID: ${{ secrets.APPLE_BETA_GROUP_ID }}
        run: |
          set -euo pipefail
          python3 tools/ci/app_store_connect.py wait-and-distribute \
            --key-id "$APPLE_KEY_ID" \
            --issuer-id "$APPLE_ISSUER_ID" \
            --private-key "$CI_ASC_KEY_PATH" \
            --bundle-id "$BUNDLE_ID" \
            --marketing-version "$IOS_SHORT_VERSION" \
            --build-number "$IOS_BUILD_NUMBER" \
            --group-id "$APPLE_BETA_GROUP_ID" \
            --ipa "$IPA" \
            --delivery-uuid "${DELIVERY_UUID:-}" \
            --output "$SML_PRODUCT_DIR/testflight-receipt.json" \
            --timeout-seconds 2400 \
            --interval-seconds 30
          cat "$SML_PRODUCT_DIR/testflight-receipt.json"

      - name: Retain TestFlight receipt
        if: ${{ always() && inputs.upload_to_testflight == 'true' }}
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3.2.1
        with:
          name: such-moon-launch-testflight-${{ github.sha }}-build-${{ env.IOS_BUILD_NUMBER }}
          path: |
            ${{ env.SML_PRODUCT_DIR }}/testflight-receipt.json
            ${{ env.SML_LOG_DIR }}/altool-validate.log
            ${{ env.SML_LOG_DIR }}/altool-upload.log
          if-no-files-found: warn
          retention-days: 30

      - name: Cleanup source link and signing material
        if: always()
        run: |
          set +e
          if [ -L .godot ] && \
             [ "$(readlink .godot)" = "${SML_PROJECT_CACHE:-unset}" ]; then
            rm -f .godot
          fi
          if [ -n "${CI_ORIGINAL_KEYCHAINS:-}" ] && [ -f "$CI_ORIGINAL_KEYCHAINS" ]; then
            ORIGINAL_PATHS=()
            while IFS= read -r path; do
              [ -z "$path" ] || ORIGINAL_PATHS+=("$path")
            done < "$CI_ORIGINAL_KEYCHAINS"
            [ "${#ORIGINAL_PATHS[@]}" -eq 0 ] || \
              security list-keychains -d user -s "${ORIGINAL_PATHS[@]}"
          fi
          [ -z "${CI_KEYCHAIN_PATH:-}" ] || security delete-keychain "$CI_KEYCHAIN_PATH" 2>/dev/null
          if [ "${CI_PROFILE_CREATED:-false}" = "true" ] && [ -n "${CI_PROFILE_PATH:-}" ]; then
            rm -f "$CI_PROFILE_PATH"
          fi
          [ -z "${CI_ASC_KEY_PATH:-}" ] || rm -f "$CI_ASC_KEY_PATH"
          case "${SML_SECRET_DIR:-}" in
            "$RUNNER_TEMP"/such-moon-launch-signing.*) rm -rf -- "$SML_SECRET_DIR" ;;
            "") ;;
            *) echo "WARNING: refusing to remove unexpected secret directory: $SML_SECRET_DIR" ;;
          esac

# Web and Linux desktop candidates.
#
# Moon Launch had CI for Android and iOS only, so the web and desktop targets in
# export_presets.cfg were built by hand or not at all: the newest artifacts on
# disk were two months old and builds/web held no export whatsoever.
#
# Scope is deliberate. Web and Linux need no code signing, so they can go green
# today. Windows and macOS need the certificate work described in
# ~/src/docs/infra/desktop-ci-runners.md and apple-desktop-signing.md, which is
# its own project; a lane that claims four targets and can only deliver two is
# worse than one that says which two.
#
# The Godot and export-template installation is lifted from
# build-android-candidate.yml rather than reinvented, including its pinned
# checksums, so there is one way this fleet obtains a toolchain.
name: Such Moon Launch web and desktop candidates

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "Full reviewed master commit SHA; must equal the dispatched SHA"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: such-moon-launch-desktop-web-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  GODOT_VERSION: "4.6.1-stable"

jobs:
  web-and-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          lfs: false
          submodules: false
          persist-credentials: false

      # The dispatcher names the commit it reviewed. If the ref moved between
      # review and dispatch, this is where that is caught rather than after a
      # build that nobody reviewed has been retained as a candidate.
      - name: Validate the dispatched commit
        env:
          REQUESTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "FATAL: expected_sha must be a full lowercase commit SHA."; exit 1; }
          [ "$REQUESTED_SHA" = "${GITHUB_SHA:-}" ] || {
            echo "FATAL: reviewed SHA $REQUESTED_SHA != dispatched ${GITHUB_SHA:-unset}."
            exit 1; }

      # A disposable root per run, so a build never reads state another run left
      # behind and never writes into the checkout.
      - name: Prepare a disposable run root
        run: |
          set -euo pipefail
          RUN_ROOT="$(mktemp -d "${RUNNER_TEMP:-/tmp}/such-moon-launch-web.XXXXXX")"
          XDG_ROOT="$RUN_ROOT/xdg"
          mkdir -p "$RUN_ROOT/products" "$RUN_ROOT/toolchain" \
            "$XDG_ROOT/data" "$XDG_ROOT/cache" "$XDG_ROOT/config"
          chmod 700 "$RUN_ROOT"
          {
            echo "SML_CI_BUILD_ROOT=$RUN_ROOT"
            echo "SML_PRODUCT_DIR=$RUN_ROOT/products"
            echo "XDG_DATA_HOME=$XDG_ROOT/data"
            echo "XDG_CACHE_HOME=$XDG_ROOT/cache"
            echo "XDG_CONFIG_HOME=$XDG_ROOT/config"
          } >> "$GITHUB_ENV"

      - name: Locate Godot and install verified export templates
        run: |
          set -euo pipefail
          CACHE="$HOME/Build/such-moon-launch/cache/toolchain-linux/$GODOT_VERSION"
          ARCHIVE="$CACHE/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          TEMPLATES_ARCHIVE="$CACHE/Godot_v${GODOT_VERSION}_export_templates.tpz"
          GODOT_SHA512="a76fd0fe1d44a2dd6c065b6f7b434ad75f5593c07bda3d3017f8304f2d069acbcf0f39cb5d0976f0434b56e9ea852032ddbcbdb7e0ce1c75a47e1dacb6794bd7"
          TEMPLATES_SHA512="d80001711c07973b1fd3e88077ba99644e19db7c9e52627e16f38a2937879f809f94dbd8493936fb8204908bbc57a521d41173dce5208061fe4c99772490c541"
          EXPECTED_VERSION="${GODOT_VERSION/-/.}"
          mkdir -p "$CACHE"

          if [ ! -f "$ARCHIVE" ]; then
            PARTIAL="$ARCHIVE.${GITHUB_RUN_ID:-manual}.partial"
            curl --fail --location --proto '=https' --tlsv1.2 \
              --output "$PARTIAL" \
              "https://github.com/godotengine/godot/releases/download/$GODOT_VERSION/$(basename "$ARCHIVE")"
            mv "$PARTIAL" "$ARCHIVE"
          fi
          printf '%s  %s\n' "$GODOT_SHA512" "$ARCHIVE" | sha512sum --check

          GODOT_DIR="$SML_CI_BUILD_ROOT/toolchain/godot"
          mkdir -p "$GODOT_DIR"
          unzip -q "$ARCHIVE" -d "$GODOT_DIR"
          GODOT_BIN="$GODOT_DIR/Godot_v${GODOT_VERSION}_linux.x86_64"
          chmod +x "$GODOT_BIN"
          "$GODOT_BIN" --version | grep -Fq "$EXPECTED_VERSION"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"

          if [ ! -f "$TEMPLATES_ARCHIVE" ]; then
            PARTIAL="$TEMPLATES_ARCHIVE.${GITHUB_RUN_ID:-manual}.partial"
            curl --fail --location --proto '=https' --tlsv1.2 \
              --output "$PARTIAL" \
              "https://github.com/godotengine/godot/releases/download/$GODOT_VERSION/$(basename "$TEMPLATES_ARCHIVE")"
            mv "$PARTIAL" "$TEMPLATES_ARCHIVE"
          fi
          printf '%s  %s\n' "$TEMPLATES_SHA512" "$TEMPLATES_ARCHIVE" | sha512sum --check
          TEMPLATE_STAGE="$SML_CI_BUILD_ROOT/toolchain/templates-stage"
          TEMPLATE_DEST="$XDG_DATA_HOME/godot/export_templates/${GODOT_VERSION/-/.}"
          mkdir -p "$TEMPLATE_STAGE" "$(dirname "$TEMPLATE_DEST")"
          unzip -q "$TEMPLATES_ARCHIVE" -d "$TEMPLATE_STAGE"
          mv "$TEMPLATE_STAGE/templates" "$TEMPLATE_DEST"
          test -f "$TEMPLATE_DEST/web_release.zip"
          test -f "$TEMPLATE_DEST/linux_release.x86_64"

      # An export against a stale or hand-made resource cache is not an export of
      # this commit. tools/ci/verify.sh refuses an unmanaged cache for the same
      # reason; this simply builds its own.
      - name: Import project resources
        run: |
          set -euo pipefail
          [ ! -e .godot ] || { echo "FATAL: checkout already carries a .godot cache."; exit 1; }
          "$GODOT_BIN" --headless --path . --import
          test -d .godot

      - name: Export the web candidate
        run: |
          set -euo pipefail
          OUT="$SML_PRODUCT_DIR/web"
          mkdir -p "$OUT"
          "$GODOT_BIN" --headless --path . --export-release "Web" "$OUT/index.html"
          test -s "$OUT/index.html" || { echo "FATAL: no index.html produced."; exit 1; }
          test -s "$OUT/index.wasm" || { echo "FATAL: no wasm produced."; exit 1; }
          echo "web bundle: $(du -sh "$OUT" | cut -f1)"

      - name: Export the Linux candidate
        run: |
          set -euo pipefail
          OUT="$SML_PRODUCT_DIR/linux"
          mkdir -p "$OUT"
          "$GODOT_BIN" --headless --path . --export-release "Linux" "$OUT/SuchMoonLaunch.x86_64"
          test -s "$OUT/SuchMoonLaunch.x86_64" || { echo "FATAL: no Linux binary."; exit 1; }
          chmod +x "$OUT/SuchMoonLaunch.x86_64"
          echo "linux binary: $(du -h "$OUT/SuchMoonLaunch.x86_64" | cut -f1)"

      # Retained beside the other lanes' candidates, keyed by run, so a candidate
      # can be traced to the commit and the run that produced it.
      - name: Retain the candidates with their provenance
        run: |
          set -euo pipefail
          DEST="$HOME/Build/such-moon-launch/actions/${GITHUB_RUN_ID:-manual}"
          mkdir -p "$DEST"
          cp -R "$SML_PRODUCT_DIR/." "$DEST/"
          {
            echo "commit=${GITHUB_SHA:-unknown}"
            echo "run_id=${GITHUB_RUN_ID:-manual}"
            echo "godot=${GODOT_VERSION}"
            echo "targets=web,linux"
          } > "$DEST/provenance.txt"
          echo "retained at $DEST"
